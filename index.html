<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skin2URL</title>
    <meta
      name="description"
      content="Upload Minecraft skins and get copyable URLs, Multi-file upload support."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="drag-overlay" class="drag-overlay" aria-hidden="true">
      <p>Drop skins anywhere</p>
    </div>

    <header class="topbar">
      <a class="brand" href="./">Skin2URL</a>
      <p class="tagline">Upload skins · Get URLs</p>
    </header>

    <main class="main">
      <section id="upload-panel" class="upload-panel" aria-label="Upload skins">
        <div
          id="dropzone"
          class="dropzone"
          tabindex="0"
          role="button"
          aria-label="Drop skin images anywhere"
        >
          <div class="dropzone-inner">
            <svg
              class="dropzone-icon"
              viewBox="0 0 64 64"
              width="72"
              height="72"
              aria-hidden="true"
            >
              <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
              <path
                d="M32 44V22M32 22l-10 10M32 22l10 10"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p class="dropzone-title">Drop images here</p>
          </div>
        </div>

        <input
          id="file-input"
          type="file"
          accept="image/png,.png"
          multiple
          hidden
        />

        <p id="summary" class="summary" aria-live="polite"></p>
        <p id="config-warning" class="config-warning hidden">
          Set your ImgBB API key in <code>config.js</code> before uploading.
          See the README for setup steps.
        </p>
      </section>

      <section id="results" class="results" aria-label="Upload results"></section>
    </main>

    <footer class="footer">
      <span>Skin2URL - By Agam (The_Crazy_Agam)</span>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
